name: CI

on:
  push:
    branches:
      - dev-v1
  # pull_request:
  # workflow_dispatch:

jobs:
  verify:
    # Only `linux` is advertised by the self-hosted runner (see
    # infrastructure/compose/gitea.yml: GITEA_RUNNER_LABELS=linux).
    runs-on: linux
    timeout-minutes: 20

    # node:24-bookworm already ships node, npm and git, so no JS actions
    # (checkout/setup-node) are needed - they would only need a `node` binary
    # in PATH and would try to download an extra Node toolchain.
    container:
      image: node:24-bookworm

    steps:
      # `actions/checkout` runs as a JS action in this container and fetches
      # from $GITHUB_SERVER_URL (http://gitea:3000). The runner must run the
      # job container on the same docker network as the gitea service, which
      # is configured via container.network in compose/act_runner.yaml.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit / component / contract / security
        run: npm test

      - name: Integration / API / contract / security
        run: npm run test:integration:business

      - name: Build
        run: npm run build