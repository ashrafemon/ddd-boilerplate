name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: linux
    timeout-minutes: 20

    # Plain node image: includes node, npm, git, and ca-certificates.
    container:
      image: node:24-bookworm

    steps:
      - name: Checkout
        run: |
          REPO_URL="${{ github.serverUrl }}/${{ github.repository }}.git"
          if [ -n "${{ github.token }}" ]; then
            git clone --depth 1 "https://${{ github.token }}@${REPO_URL#https://}" .
          else
            git clone --depth 1 "$REPO_URL" .
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit / component / contract / security
        run: npm test

      - name: Integration / API / contract / security
        run: npm run test:integration:business

      - name: Build
        run: npm run build
