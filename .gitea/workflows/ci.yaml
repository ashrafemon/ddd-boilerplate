name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # JS actions (checkout, setup-node) need node in PATH. The node:24-bookworm
    # image includes both node and git, so the runner image does not need them.
    container:
      image: node:24-bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit / component / contract / security
        run: npm test

      - name: Integration / API / contract / security
        run: npm run test:integration:business

      - name: Build
        run: npm run build
